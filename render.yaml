services:
  - type: web
    name: poe-scraper
    runtime: docker
    rootDir: scrapper
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/tasks.db
      - key: MAX_CONCURRENT_BROWSERS
        value: "2"
      - key: SEARCH_PROVIDER
        value: duckduckgo
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: poe-api
    runtime: docker
    rootDir: poe-app/backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: POE_API_URL
        value: https://poe-scraper.onrender.com/find-poe/
      - key: POE_ALLOWED_ORIGINS
        value: https://poe-scrapper.vercel.app,https://frontend-gamma-ten-33.vercel.app
      - key: POE_DB_PATH
        value: /tmp/poe_test.db
